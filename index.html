<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urea to Ammonia Calculator</title>
 
<style>
body{
font-family: Arial, sans-serif;
background:#f4f6f9;
margin:0;
padding:15px;
}
 
.container{
max-width:500px;
margin:auto;
}
 
.card{
background:#fff;
padding:20px;
border-radius:15px;
box-shadow:0 2px 8px rgba(0,0,0,0.15);
}
 
h1{
text-align:center;
color:#0066cc;
font-size:24px;
}
 
label{
font-weight:bold;
margin-top:15px;
display:block;
}
 
input{
width:100%;
padding:12px;
margin-top:5px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
box-sizing:border-box;
}
 
button{
width:100%;
padding:14px;
margin-top:20px;
background:#28a745;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}
 
button:hover{
background:#218838;
}
 
.result{
margin-top:20px;
}
 
.result-box{
background:#eaf4ff;
padding:12px;
margin-bottom:10px;
border-radius:8px;
}
 
.result-title{
font-weight:bold;
color:#003366;
}
 
.result-value{
font-size:20px;
color:#000;
}
 
.footer{
text-align:center;
margin-top:15px;
color:#666;
font-size:12px;
}
</style>
</head>
 
<body>
 
<div class="container">
<div class="card">
 
<h1>UREA TO AMMONIA CALCULATOR</h1>
 
<label>Land Area (Hectare)</label>
<input type="number" id="hectare" value="1">
 
<label>Total Urea Quantity (Kg)</label>
<input type="number" id="urea" value="261">
 
<label>Cylinder Capacity (Kg)</label>
<input type="number" id="capacity" value="50">
 
<label>Utilization (%)</label>
<input type="number" id="utilization" value="80">
 
<button onclick="calculate()">Calculate</button>
 
<div class="result">
 
<div class="result-box">
<div class="result-title">Land Area (Acre)</div>
<div class="result-value" id="acre">0</div>
</div>
 
<div class="result-box">
<div class="result-title">Nitrogen Quantity (Kg)</div>
<div class="result-value" id="nitrogen">0</div>
</div>
 
<div class="result-box">
<div class="result-title">Required NH₃ Quantity (Kg)</div>
<div class="result-value" id="nh3">0</div>
</div>
 
<div class="result-box">
<div class="result-title">Cylinders Required</div>
<div class="result-value" id="cylinders">0</div>
</div>
 
</div>
 
<div class="footer">
Powered by Acme Group
</div>
 
</div>
</div>
 
<script>
 
function calculate(){
 
let hectare = parseFloat(document.getElementById("hectare").value) || 0;
let urea = parseFloat(document.getElementById("urea").value) || 0;
let capacity = parseFloat(document.getElementById("capacity").value) || 50;
let utilization = parseFloat(document.getElementById("utilization").value) || 80;
 
let acre = hectare * 2.47105383;
 
let nitrogen = urea * 0.46;
 
let nh3 = nitrogen / 0.82;
 
let effectiveCapacity = capacity * (utilization / 100);
 
let cylinders = nh3 / effectiveCapacity;
 
document.getElementById("acre").innerHTML =
acre.toFixed(2);
 
document.getElementById("nitrogen").innerHTML =
nitrogen.toFixed(2) + " Kg";
 
document.getElementById("nh3").innerHTML =
nh3.toFixed(2) + " Kg";
 
document.getElementById("cylinders").innerHTML =
Math.ceil(cylinders) + " Nos";
}
 
calculate();
 
</script>
 
</body>
</html>
